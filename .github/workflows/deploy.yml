name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Restore last successful Pocket Part feed
        uses: actions/cache/restore@v4
        with:
          path: data/pocket-part.json
          key: pocket-part-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pocket-part-

      - name: Refresh Pocket Part feed
        run: node scripts/update-pocket-part.mjs

      - name: Save Pocket Part feed for future builds
        uses: actions/cache/save@v4
        with:
          path: data/pocket-part.json
          key: pocket-part-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Refresh UCPEA Union Wire feed
        run: node "Pages/Work/UCPEA/update-union-wire.mjs"

      - name: Prepare static site
        run: npm run build -- --skip-feed

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
