<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Justin Rogowski’s daily steps, time in recorded sleep sessions, and average heart rate.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Daily Activity | Justin Rogowski</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="frame"><a href="/">Justin Rogowski</a></div>
  </header>
  <main class="frame">
    <header class="intro">
      <h1>Daily Activity</h1>
      <p>Steps, recorded sleep sessions, and average heart rate by day.</p>
    </header>

    <p id="status" class="status" role="status">Loading daily activity…</p>
    <noscript><p>Enable JavaScript to view the chart and daily table.</p></noscript>
    <div id="dashboard" hidden>
      <div class="metrics" role="group" aria-label="Metric">
        <button type="button" data-metric="steps" aria-pressed="true">Steps</button>
        <button type="button" data-metric="sleep_minutes" aria-pressed="false">Sleep sessions</button>
        <button type="button" data-metric="heart_rate_bpm" aria-pressed="false">Heart rate</button>
      </div>

      <section class="report" aria-labelledby="metric-title">
        <div class="report-heading">
          <div class="metric-heading">
            <h2 id="metric-title">Daily steps</h2>
            <p id="metric-note"></p>
          </div>
          <dl class="latest" aria-live="polite" aria-atomic="true">
            <dt>Latest recorded</dt>
            <dd id="latest-date"></dd>
            <dd id="latest-value"></dd>
          </dl>
        </div>
        <div class="range" role="group" aria-label="Date range">
          <button type="button" data-range="7" aria-pressed="false">7 days</button>
          <button type="button" data-range="30" aria-pressed="true">30 days</button>
          <button type="button" data-range="90" aria-pressed="false">90 days</button>
          <button type="button" data-range="year" aria-pressed="false">1 year</button>
          <button type="button" data-range="all" aria-pressed="false">All time</button>
        </div>
        <figure>
          <div class="chart">
            <canvas id="chart" role="img" aria-describedby="chart-caption"></canvas>
            <div id="chart-guide" class="chart-guide" aria-hidden="true" hidden></div>
            <div id="chart-tooltip" class="tooltip" aria-hidden="true" hidden></div>
          </div>
          <figcaption id="chart-caption">
            <span id="chart-dates"></span>
            <span class="chart-hint">Hover or tap for daily values</span>
            <span>Calendar dates in Eastern Time</span>
          </figcaption>
        </figure>
      </section>

      <section class="history" aria-labelledby="history-title">
        <div class="history-heading">
          <div>
            <h2 id="history-title">Daily values</h2>
            <p>A dash indicates a day without a record for that metric.</p>
          </div>
          <div class="pager" role="group" aria-label="Page of daily values">
            <button type="button" id="newer">Newer</button>
            <span id="page" role="status"></span>
            <button type="button" id="older">Older</button>
          </div>
        </div>
        <table aria-labelledby="history-title">
          <thead><tr>
            <th scope="col">Date</th>
            <th scope="col" data-column="steps">Steps</th>
            <th scope="col" data-column="sleep_minutes">Sleep sessions</th>
            <th scope="col" data-column="heart_rate_bpm">Avg. heart rate</th>
          </tr></thead>
          <tbody id="daily-rows"></tbody>
        </table>
      </section>
    </div>
  </main>
</body>
</html>
