    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Record and review library occupancy across five floors, online or offline.">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Occupancy">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <title>Law Library Heatmap</title>
    <script>
        (() => {
            const allowedThemes = new Set(['dark', 'light', 'oled']);
            let savedTheme = 'dark';
            try { savedTheme = localStorage.getItem('occupancy-heatmap-theme') || savedTheme; } catch {}
            const initialTheme = allowedThemes.has(savedTheme) ? savedTheme : 'dark';
            document.documentElement.dataset.theme = initialTheme;
            document.querySelector('meta[name="theme-color"]').content =
                initialTheme === 'light' ? '#f1f5f9' : initialTheme === 'oled' ? '#000000' : '#0f172a';
        })();
    </script>
    <style>
        :root {
            color-scheme: dark;
            --bg-body: #0f172a;       /* Slate 900 */
            --bg-panel: rgba(30, 41, 59, 0.85); /* Slate 800 with alpha */
            --bg-element: #334155;    /* Slate 700 */
            --bg-overlay: rgba(15, 23, 42, 0.94);
            --bg-hover: #475569;
            --bg-input: rgba(0, 0, 0, 0.2);
            --bg-input-focus: rgba(0, 0, 0, 0.3);
            --bg-subtle: rgba(255, 255, 255, 0.05);
            --chart-grid: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;       /* Blue 500 */
            --primary-hover: #2563eb; /* Blue 600 */
            --danger: #ef4444;        /* Red 500 */
            --text-main: #f1f5f9;     /* Slate 100 */
            --text-muted: #94a3b8;    /* Slate 400 */
            --border: #1e293b;        /* Slate 800 */
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg-body: #f1f5f9;
            --bg-panel: rgba(255, 255, 255, 0.92);
            --bg-element: #e2e8f0;
            --bg-overlay: rgba(255, 255, 255, 0.96);
            --bg-hover: #cbd5e1;
            --bg-input: rgba(15, 23, 42, 0.06);
            --bg-input-focus: rgba(15, 23, 42, 0.1);
            --bg-subtle: rgba(15, 23, 42, 0.06);
            --chart-grid: rgba(15, 23, 42, 0.12);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --shadow: 0 4px 10px -2px rgba(15, 23, 42, 0.16);
        }

        :root[data-theme="oled"] {
            color-scheme: dark;
            --bg-body: #000;
            --bg-panel: rgba(0, 0, 0, 0.96);
            --bg-element: #171717;
            --bg-overlay: rgba(0, 0, 0, 0.97);
            --bg-hover: #262626;
            --bg-input: #0a0a0a;
            --bg-input-focus: #111;
            --bg-subtle: rgba(255, 255, 255, 0.08);
            --chart-grid: rgba(255, 255, 255, 0.12);
            --primary: #60a5fa;
            --primary-hover: #3b82f6;
            --danger: #f87171;
            --text-main: #fff;
            --text-muted: #a3a3a3;
            --border: #262626;
            --shadow: none;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevent body scroll, handle inside wrap */
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 20;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0; /* allows flex children to shrink */
        }

        .logo-area {
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
        }
        
        .stat-badge {
            background: var(--bg-element);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.9rem;
            color: var(--text-main);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .tutorial-trigger {
            min-height: 32px;
            padding: 0.3rem 0.65rem;
            border-radius: 99px;
            background: var(--bg-input);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .tutorial-trigger:hover:not(:disabled) {
            color: var(--text-main);
        }

        .tutorial-trigger svg {
            flex: 0 0 auto;
        }

        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-height: 32px;
            padding: 0.3rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 99px;
            background: var(--bg-input);
            color: var(--text-muted);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.12);
        }

        .sync-status[data-state="saved"] .sync-dot { background: var(--primary); }
        .sync-status[data-state="sending"] .sync-dot { background: #f59e0b; animation: pulse 1s ease-in-out infinite; }
        .sync-status[data-state="sent"] .sync-dot { background: #10b981; }
        .sync-status[data-state="offline"] .sync-dot,
        .sync-status[data-state="error"] .sync-dot { background: var(--danger); }

        @keyframes pulse {
            50% { opacity: 0.35; }
        }

        .mode-switch,
        .theme-switch {
            display: inline-flex;
            padding: 3px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-input);
        }

        .mode-switch button,
        .theme-switch button {
            min-height: 38px;
            padding: 0.4rem 0.75rem;
            border: 0;
            background: transparent;
            color: var(--text-muted);
        }

        .mode-switch button.active,
        .theme-switch button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow);
        }

        .panel .mode-switch,
        .panel .theme-switch {
            width: 100%;
        }

        .panel .mode-switch button,
        .panel .theme-switch button {
            flex: 1;
            min-height: 44px;
        }

        body[data-mode="count"] .analyze-only,
        body[data-mode="analyze"] .count-only {
            display: none !important;
        }

        /* --- Scrollable Tabs --- */
        .tabs-container {
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE */
            mask-image: linear-gradient(to right, transparent, black 10px, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10px, black 90%, transparent);
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tabs {
            display: flex;
            gap: 0.5rem;
            padding: 0 10px;
        }

        .tab {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab:hover {
            background: var(--bg-subtle);
            color: var(--text-main);
        }

        .tab.active {
            background: var(--bg-element);
            color: var(--primary);
            border-color: var(--border);
            box-shadow: var(--shadow);
        }

        .tab .badge {
            background: var(--bg-input-focus);
            font-size: 0.75rem;
            padding: 0.1rem 0.4rem;
            border-radius: 99px;
            color: var(--text-muted);
        }
        .tab.active .badge {
            background: var(--primary);
            color: white;
        }

        /* --- Main Canvas Area --- */
        #wrap {
            position: relative;
            flex: 1;
            background-image: radial-gradient(var(--bg-element) 1px, transparent 1px);
            background-size: 20px 20px; /* Grid pattern effect */
            overflow: hidden;
            touch-action: none;
            cursor: crosshair;
        }

        body[data-mode="analyze"] #wrap,
        #wrap.is-panning {
            cursor: grab;
        }

        #wrap.is-panning {
            cursor: grabbing;
        }

        #floor, #heat {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #heat { pointer-events: none; }

        .map-controls {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-overlay);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow);
        }

        .map-controls button {
            min-width: 44px;
            min-height: 44px;
            padding: 0.45rem 0.65rem;
        }

        .zoom-readout {
            min-width: 48px;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        .undo-toast {
            position: absolute;
            left: 50%;
            bottom: 0.75rem;
            z-index: 12;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: min(360px, calc(100% - 2rem));
            padding: 0.55rem 0.65rem 0.55rem 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-overlay);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
            color: var(--text-main);
        }

        .undo-toast[hidden] { display: none; }
        .undo-toast span { flex: 1; font-size: 0.88rem; }
        .undo-toast button { min-width: 64px; }

        /* --- Footer / Controls --- */
        footer {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: grid;
            grid-template-columns: auto 1fr auto; /* Tools | Notes | Submit */
            gap: 1rem;
            align-items: center;
            z-index: 20;
        }
        footer[hidden] { display: none; }

        .toolbar-group {
            display: flex;
            gap: 0.5rem;
        }

        /* Buttons */
        button {
            border: 1px solid var(--border);
            background: var(--bg-element);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 44px;
        }

        button:hover:not(:disabled) {
            background: var(--bg-hover);
        }
        button:active:not(:disabled) {
            transform: scale(0.97);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.icon-only {
            padding: 0.6rem;
            font-size: 1.2rem;
            line-height: 1;
            min-width: 44px;
        }

        /* Submit Button Special Styling */
        .submitbtn {
            background: var(--primary);
            border-color: var(--primary-hover);
            color: white;
            font-weight: 600;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .submitbtn:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        /* Textarea styling */
        .notes-wrap {
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
        }
        
        #notes {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 0.6rem;
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            width: 100%;
            height: 44px; /* Compact, with a tablet-sized touch target */
            transition: height 0.2s, border-color 0.2s;
        }
        #notes:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-input-focus);
            height: 80px; /* Expands on focus */
            position: absolute;
            bottom: 0;
            z-index: 30;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
        }

        /* --- Guided tutorial --- */
        .tutorial-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            pointer-events: none;
        }

        .tutorial-overlay[hidden],
        .tutorial-card [hidden] {
            display: none !important;
        }

        .tutorial-backdrop {
            position: absolute;
            inset: 0;
            pointer-events: auto;
        }

        .tutorial-spotlight {
            position: fixed;
            z-index: 1;
            border: 3px solid #60a5fa;
            border-radius: 14px;
            box-shadow:
                0 0 0 9999px rgba(2, 6, 23, 0.76),
                0 0 0 6px rgba(96, 165, 250, 0.2),
                0 12px 32px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            transition: top 0.18s ease, left 0.18s ease, width 0.18s ease, height 0.18s ease;
        }

        .tutorial-card {
            position: fixed;
            z-index: 2;
            width: min(370px, calc(100vw - 2rem));
            max-height: calc(100dvh - 2rem);
            overflow-y: auto;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--bg-overlay);
            color: var(--text-main);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.48);
            pointer-events: auto;
        }

        .tutorial-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }

        .tutorial-step-count {
            color: var(--primary);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .tutorial-close {
            min-width: 36px;
            min-height: 36px;
            padding: 0.35rem;
            background: transparent;
            font-size: 1.1rem;
        }

        .tutorial-card h2 {
            margin: 0 0 0.5rem;
            font-size: 1.2rem;
        }

        .tutorial-card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .tutorial-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tutorial-actions .tutorial-skip {
            margin-right: auto;
            padding-inline: 0.5rem;
            border-color: transparent;
            background: transparent;
            color: var(--text-muted);
        }

        .tutorial-actions .tutorial-next {
            min-width: 88px;
            border-color: var(--primary-hover);
            background: var(--primary);
            color: #fff;
            font-weight: 650;
        }

        .tutorial-actions .tutorial-next:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        /* --- Settings Panel --- */
        .panel {
            position: fixed;
            top: 70px;
            right: 1rem;
            width: 300px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            z-index: 50;
            transform-origin: top right;
            transition: transform 0.2s, opacity 0.2s;
            max-height: calc(100dvh - 90px);
            overflow-y: auto;
        }

        .panel input[type="datetime-local"],
        .panel input[type="time"] {
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 4px;
            width: 100%;
            min-height: 44px;
            font-family: inherit;
        }

        .dow-filter { display: flex; gap: 4px; }
        .dow-filter button { flex: 1; padding: 0.4rem 0; font-size: 0.8rem; }
        .dow-filter button.on {
            background: var(--primary);
            border-color: var(--primary-hover);
            color: #fff;
        }
        
        .panel[hidden] {
            display: flex !important; /* Override default hidden display */
            transform: scale(0.95);
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        .panel button[hidden],
        .panel input[hidden] {
            display: none !important;
        }

        .panel h3 {
            margin: 0 0 0.5rem 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .control-row label {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }
        
        /* Custom Range Inputs */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 44px;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: var(--bg-element);
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--primary);
            margin-top: -9px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        
        /* File Inputs */
        input[type="file"] {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        input[type="file"]::file-selector-button {
            border: 1px solid var(--border);
            background: var(--bg-element);
            color: var(--text-main);
            border-radius: 4px;
            padding: 0.65rem 0.75rem;
            margin-right: 0.5rem;
            cursor: pointer;
        }

        /* --- Playback Bar --- */
        #playbackBar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1rem;
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            z-index: 15;
            flex-wrap: wrap;
        }
        #playbackBar[hidden] { display: none; }
        #pbSlider { flex: 1; min-width: 120px; }
        #pbLabel {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        #playbackBar button { padding: 0.35rem 0.6rem; font-size: 0.9rem; }
        #pbAll.active-mode { color: var(--primary); border-color: var(--primary); }

        /* --- Analytics Overlay --- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg-body);
            display: flex;
            flex-direction: column;
        }
        .overlay[hidden] { display: none; }
        .overlay-head {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }
        .overlay-head h2 { margin: 0; font-size: 1.1rem; flex: 1; white-space: nowrap; }
        .an-muted { color: var(--text-muted); font-size: 0.85rem; }
        .overlay-body { flex: 1; overflow-y: auto; padding: 1rem; }
        #anContent { display: grid; gap: 1rem; }
        #anContent[hidden] { display: none; }
        .an-empty { color: var(--text-muted); text-align: center; padding: 3rem 1rem; }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
        }
        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
        }
        .stat-card .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
        .stat-card .v { font-size: 1.5rem; font-weight: 700; margin-top: 0.15rem; }
        .stat-card .s { font-size: 0.75rem; color: var(--text-muted); }

        .chart-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
        }
        .chart-card h3 {
            margin: 0 0 0.75rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        #anLine { display: block; }
        .legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.6rem; font-size: 0.8rem; color: var(--text-muted); }
        .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

        .dow-grid-wrap { overflow-x: auto; }
        .dow-grid {
            display: grid;
            grid-template-columns: 38px repeat(24, minmax(16px, 1fr));
            gap: 2px;
            min-width: 540px;
        }
        .dow-cell { aspect-ratio: 1; border-radius: 3px; background: var(--bg-subtle); }
        .dow-lbl {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floor-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .floor-row:last-child { margin-bottom: 0; }
        .floor-row .fl-name { width: 64px; color: var(--text-muted); flex-shrink: 0; }
        .floor-row .fl-bar-wrap { flex: 1; background: var(--bg-subtle); border-radius: 99px; height: 14px; overflow: hidden; }
        .floor-row .fl-bar { height: 100%; border-radius: 99px; }
        .floor-row .fl-val { width: 120px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {

            header { gap: 0.5rem; padding-inline: 0.5rem; }
            .header-left { gap: 0.5rem; }
            .header-actions { gap: 0.4rem; }
            .stat-badge { padding-inline: 0.5rem; }
            .stat-label { display: none; }

            .map-controls {
                top: 0.5rem;
                right: 0.5rem;
            }
            .map-controls .wide-control { display: none; }
            footer {
                grid-template-columns: 1fr 1fr; /* Two columns */
                grid-template-areas: 
                    "tools submit"
                    "notes notes";
            }
            .toolbar-group { grid-area: tools; }
            .submitbtn { grid-area: submit; width: 100%; }
            .notes-wrap { grid-area: notes; margin-top: 0.5rem; }
            
            #notes:focus {
                position: static; /* Don't pop up on mobile, keeps flow */
                height: 60px;
            }

            .tutorial-card {
                width: calc(100vw - 1rem);
                max-height: calc(100dvh - 1rem);
            }
        }

        @media (max-width: 430px) {
            .tutorial-trigger-label { display: none; }
            .tutorial-trigger { min-width: 36px; padding-inline: 0.45rem; }
            .sync-status { padding-inline: 0.5rem; }
        }

        /* Phone portrait: show every floor at once and prioritize notes. */
        @media (max-width: 768px) and (orientation: portrait) {
            header {
                display: grid;
                grid-template-columns: auto 1fr;
                grid-template-areas:
                    "menu actions"
                    "floors floors";
                align-items: center;
                gap: 0.5rem;
                padding: 0.5rem;
            }

            .header-left { display: contents; }
            #menuBtn { grid-area: menu; }

            .header-actions {
                grid-area: actions;
                justify-self: end;
            }

            .tabs-container {
                grid-area: floors;
                width: 100%;
                overflow: visible;
                mask-image: none;
                -webkit-mask-image: none;
            }

            .tabs {
                flex-direction: column;
                gap: 0.25rem;
                padding: 0;
            }

            .tab {
                width: 100%;
                min-height: 44px;
                justify-content: space-between;
                padding-inline: 0.9rem;
            }

            footer {
                grid-template-areas:
                    "notes notes"
                    "tools submit";
            }

            .notes-wrap {
                margin-top: 0;
                margin-bottom: 0.25rem;
            }
        }
    </style>
</head>

            // --- Floors ---------------------------------------------------------------

            const THEMES = ['dark', 'light', 'oled'];
            const THEME_KEY = 'occupancy-heatmap-theme';
            const FLOORS = [
                { id: '1F', label: '1st Floor', img: new Image(), imgSrc: null, points: [], view: { zoom: 1, panX: 0, panY: 0 } },
                { id: '2F', label: '2nd Floor', img: new Image(), imgSrc: null, points: [], view: { zoom: 1, panX: 0, panY: 0 } },
                { id: '3F', label: '3rd Floor', img: new Image(), imgSrc: null, points: [], view: { zoom: 1, panX: 0, panY: 0 } },
                { id: '4F', label: '4th Floor', img: new Image(), imgSrc: null, points: [], view: { zoom: 1, panX: 0, panY: 0 } },
                { id: '5F', label: '5th Floor', img: new Image(), imgSrc: null, points: [], view: { zoom: 1, panX: 0, panY: 0 } },
            ];
            let current = DEFAULT_FLOOR_INDEX;
            let appMode = 'count';

                ? document.documentElement.dataset.theme
                : 'dark';
            let syncState = 'ready';
            let syncResetTimer = null;
            let clearUndo = null;

            // Sessions loaded for trend review
            const SESSIONS = []; 

            // --- Elements -------------------------------------------------------------
            const wrap = document.getElementById('wrap');
            const floor = document.getElementById('floor');
            const heat = document.getElementById('heat');
            const fctx = floor.getContext('2d');
            const hctx = heat.getContext('2d');
            const undoBtn = document.getElementById('undo');

            const resetAll = document.getElementById('resetAll');
            const submitBtn = document.getElementById('submit');
            const tutorialBtn = document.getElementById('tutorialBtn');
            const tutorialOverlay = document.getElementById('tutorialOverlay');
            const tutorialBackdrop = document.getElementById('tutorialBackdrop');
            const tutorialSpotlight = document.getElementById('tutorialSpotlight');
            const tutorialCard = document.getElementById('tutorialCard');
            const tutorialStepCount = document.getElementById('tutorialStepCount');
            const tutorialTitle = document.getElementById('tutorialTitle');
            const tutorialText = document.getElementById('tutorialText');
            const tutorialCloseBtn = document.getElementById('tutorialClose');
            const tutorialSkipBtn = document.getElementById('tutorialSkip');
            const tutorialBackBtn = document.getElementById('tutorialBack');
            const tutorialNextBtn = document.getElementById('tutorialNext');

            const syncStatusTextEl = document.getElementById('syncStatusText');
            const clearToastEl = document.getElementById('clearToast');
            const clearToastTextEl = document.getElementById('clearToastText');
            const restoreClearBtn = document.getElementById('restoreClear');
            const radiusEl = document.getElementById('radius');
            const intenEl = document.getElementById('intensity');

            const notesEl = document.getElementById('notes');
            const countModeBtn = document.getElementById('countMode');

            const themeOledBtn = document.getElementById('themeOled');
            const themeColorMeta = document.querySelector('meta[name="theme-color"]');
            const totalLabelEl = document.getElementById('totalLabel');
            const zoomOutBtn = document.getElementById('zoomOut');
