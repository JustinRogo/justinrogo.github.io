    <script>
        // --- Vector2 Math Library ---
        class Vec2 {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            sub(v) { this.x -= v.x; this.y -= v.y; return this; }
            mult(n) { this.x *= n; this.y *= n; return this; }
            div(n) { this.x /= n; this.y /= n; return this; }
            magSq() { return this.x * this.x + this.y * this.y; }
            mag() { return Math.sqrt(this.magSq()); }
            normalize() { 
                let m = this.mag(); 
                if (m !== 0) this.div(m); 
                return this; 
            }
            limit(max) {
                if (this.magSq() > max * max) {
                    this.normalize();
                    this.mult(max);
                }
                return this;
            }
            setMag(n) { return this.normalize().mult(n); }
            heading() { return Math.atan2(this.y, this.x); }
            copy() { return new Vec2(this.x, this.y); }
            set(x, y) { this.x = x; this.y = y; return this; }
            
            static sub(v1, v2) { return new Vec2(v1.x - v2.x, v1.y - v2.y); }
            static distSq(v1, v2) {
                let dx = v1.x - v2.x;
                let dy = v1.y - v2.y;
                return dx * dx + dy * dy;
            }
        }

        // Reuse buckets and query storage; only inspect cells within the sight radius.
        class SpatialGrid {
            constructor(cellSize) {
                this.cellSize = cellSize;
                this.cells = [];
            }

            resize(width, height) {
                this.columns = Math.max(1, Math.ceil(width / this.cellSize));
                this.rows = Math.max(1, Math.ceil(height / this.cellSize));
                this.cells = Array.from({length: this.columns * this.rows}, () => []);
            }

            rebuild(items) {
                for (const cell of this.cells) cell.length = 0;
                for (const item of items) {
                    if (item.dead) continue;
                    const position = item.position || item;
                    const col = Math.max(0, Math.min(this.columns - 1, Math.floor(position.x / this.cellSize)));
                    const row = Math.max(0, Math.min(this.rows - 1, Math.floor(position.y / this.cellSize)));
                    this.cells[row * this.columns + col].push(item);
                }
            }

            query(x, y, radius, result) {
                result.length = 0;
                const minCol = Math.max(0, Math.min(this.columns - 1, Math.floor((x - radius) / this.cellSize)));
                const maxCol = Math.max(0, Math.min(this.columns - 1, Math.floor((x + radius) / this.cellSize)));
                const minRow = Math.max(0, Math.min(this.rows - 1, Math.floor((y - radius) / this.cellSize)));
                const maxRow = Math.max(0, Math.min(this.rows - 1, Math.floor((y + radius) / this.cellSize)));
                for (let row = minRow; row <= maxRow; row++) {
                    for (let col = minCol; col <= maxCol; col++) {
                        for (const item of this.cells[row * this.columns + col]) result.push(item);
                    }
                }
            }
        }

        // --- Simulation State ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        // Rasterize the expensive predator shadows once, then reuse them per frame.
        const predatorGlows = {
            hungry: createPredatorGlow('rgba(255, 0, 0, 1)'),
            digesting: createPredatorGlow('rgba(16, 185, 129, 0.9)')
        };

        function createPredatorGlow(color) {
            const sprite = document.createElement('canvas');
            sprite.width = sprite.height = 80;
            const glow = sprite.getContext('2d');
            glow.translate(40, 40);
            glow.beginPath();
            glow.moveTo(0, -14);
            glow.lineTo(-7, 14);
            glow.lineTo(0, 7);
            glow.lineTo(7, 14);
            glow.closePath();
            glow.fillStyle = 'hsl(0, 90%, 55%)';
            glow.shadowBlur = 12;
            glow.shadowColor = color;
            glow.fill();
            return sprite;
        }
        
        let width, height;
        let boids = [];
        let obstacles = [];
        let isDrawing = false;
        let currentMode = 'draw';
        const OBSTACLE_RADIUS = 5;
        const OBSTACLE_SPACING = 8;
        let strokeId = 0;
        let strokeSample = 0;
        let lastBrushPoint = null;
        const boidGrid = new SpatialGrid(100);
        const obstacleGrid = new SpatialGrid(50);
        const nearbyBoids = [];
        const nearbyObstacles = [];
        const newborns = [];
        let obstaclesDirty = true;
        let obstacleAvoidRadius = 48;
        const STEP_MS = 1000 / 60;
        const MAX_STEPS = 3;
        let lastFrameTime = null;
        let accumulator = 0;
        let lastCountTime = -Infinity;
        let currentPreyCount = 0;
        let currentPredCount = 0;
        
        let deathEffects = []; // Red flashes
        let birthEffects = []; // Green flashes
        
        let lastPreyCount = -1;
        let lastPredCount = -1;
        
        // Simulation Parameters
        let params = {
            // Base physics
            separationWeight: 1.5,
            alignmentWeight: 1.0,
            cohesionWeight: 1.0,
            obstacleAvoidanceWeight: 5.0,
            preyMaxForce: 0.15,
            predMaxForce: 0.10,
            
            // Ecosystem Settings
            breedSpeed: 5.0,       
            maxPrey: 800,          
            predMetabolism: 0.8,   
            
            // Default Prey Genes
            baseMaxSpeed: 3.5,
            baseFleeWeight: 4.5,
            basePerception: 100,

            // Predator Settings
            chaseWeight: 2.5,      
            predSpeed: 4.5, 
            predPerception: 180     
        };

        // --- Boid Class ---
        class Boid {
            constructor(x, y, type = 'prey', parentDna = null) {
                // Ensure starting positions are never exactly NaN
                this.position = new Vec2(Number.isFinite(x) ? x : Math.random() * width, Number.isFinite(y) ? y : Math.random() * height);
                this.previousPosition = this.position.copy();
                this.type = type;
                this.dead = false;
                
                if (this.type === 'prey') {
                    this.breedTimer = Math.random() * 1000; // Random initial maturity 

                    if (parentDna) {
                        this.dna = {
                            maxSpeed: Math.max(1.5, Math.min(10, parentDna.maxSpeed + (Math.random() - 0.5) * 0.5)),
                            perceptionRadius: Math.max(40, Math.min(200, parentDna.perceptionRadius + (Math.random() - 0.5) * 10)),
                            fleeWeight: Math.max(0, Math.min(10, parentDna.fleeWeight + (Math.random() - 0.5) * 0.5))
                        };
                    } else {
                        this.dna = {
                            maxSpeed: params.baseMaxSpeed * (0.85 + Math.random() * 0.3),
                            perceptionRadius: params.basePerception * (0.85 + Math.random() * 0.3),
                            fleeWeight: params.baseFleeWeight * (0.85 + Math.random() * 0.3)
                        };
                    }
                    this.size = 4;
                    // Color based on speed: Slow (2) = Blue, Fast (8) = Green/Yellow
                    let hue = Math.max(0, Math.min(360, 240 - (this.dna.maxSpeed - 2) * 30));
                    this.color = `hsl(${hue}, 80%, 60%)`;
                } else {
                    this.size = 7;
                    this.color = `hsl(0, 90%, 55%)`; 
                    this.energy = 1500; 
                    this.satiation = 0; // Digestion timer
                }

                let initialSpeed = this.type === 'predator' ? params.predSpeed : this.dna.maxSpeed;
                let angle = Math.random() * Math.PI * 2;
                this.velocity = new Vec2(Math.cos(angle), Math.sin(angle)).mult(initialSpeed);
                this.acceleration = new Vec2(0, 0);
                this.forces = Array.from({length: 6}, () => new Vec2(0, 0));
            }

            edges() {
                const x = this.position.x;
                const y = this.position.y;
                if (this.position.x > width + this.size) this.position.x = -this.size;
                else if (this.position.x < -this.size) this.position.x = width + this.size;
                
                if (this.position.y > height + this.size) this.position.y = -this.size;
                else if (this.position.y < -this.size) this.position.y = height + this.size;
                // Do not interpolate a wrap across the entire canvas.
                if (x !== this.position.x || y !== this.position.y) {
                    this.previousPosition.set(this.position.x, this.position.y);
                }
            }

            flock() {
                if (this.dead) return;

                const [sep, ali, coh, flee, chase, obsSteer] = this.forces;
                for (const force of this.forces) force.set(0, 0);
                
                let sepCount = 0, aliCount = 0, cohCount = 0, fleeCount = 0, chaseCount = 0, obsCount = 0;

                let sightRadius = this.type === 'predator' ? params.predPerception : this.dna.perceptionRadius;
                let perceptionSq = sightRadius * sightRadius;
                let separationRadiusSq = (sightRadius / 2) * (sightRadius / 2);
                
                let localMaxSpeed = this.type === 'predator' ? params.predSpeed : this.dna.maxSpeed;
                let maxForce = this.type === 'predator' ? params.predMaxForce : params.preyMaxForce;

                if (this.type === 'predator' && this.satiation > 0) this.satiation--;

                // Physics / Interactions
                boidGrid.query(this.position.x, this.position.y, sightRadius, nearbyBoids);
                for (let other of nearbyBoids) {
                    if (other === this || other.dead) continue;
                    
                    let dSq = Vec2.distSq(this.position, other.position);
                    
                    // ANTI-NAN SAFETY: Ignore boids that are physically sitting on the exact same pixel 
                    // This guarantees we never divide by zero during normalization.
                    if (dSq < 0.0001) continue; 
                    
                    // Predation logic (Eating)
                    if (this.type === 'predator' && other.type === 'prey') {
                        let eatRadiusSq = (this.size + other.size + 2) * (this.size + other.size + 2);
                        if (dSq < eatRadiusSq && this.satiation <= 0) {
                            other.dead = true;
                            this.energy = Math.min(4500, this.energy + 1000); // Gain energy
                            this.satiation = 40; // Digest
                            deathEffects.push({x: other.position.x, y: other.position.y, life: 1.0});
                            continue;
                        }
                    }

                    if (dSq < perceptionSq) {
                        if (this.type === other.type) {
                            ali.add(other.velocity);
                            aliCount++;
                            coh.add(other.position);
                            cohCount++;
                            
                            if (dSq < separationRadiusSq) {
                                sep.x += (this.position.x - other.position.x) / dSq;
                                sep.y += (this.position.y - other.position.y) / dSq;
                                sepCount++;
                            }
                        } else {
                            if (this.type === 'prey' && other.type === 'predator') {
                                flee.x += (this.position.x - other.position.x) / dSq;
                                flee.y += (this.position.y - other.position.y) / dSq;
                                fleeCount++;
                            } 
                            else if (this.type === 'predator' && other.type === 'prey' && this.satiation <= 0) {
                                chase.add(other.position);
                                chaseCount++;
                            }
                        }
                    }
                }

                // Obstacles
                obstacleGrid.query(this.position.x, this.position.y, obstacleAvoidRadius, nearbyObstacles);
                for (let obs of nearbyObstacles) {
                    const dx = this.position.x - obs.x;
                    const dy = this.position.y - obs.y;
                    const dSq = Math.max(0.0001, dx * dx + dy * dy);
                    
                    let avoidRadius = obs.r + 40;
                    if (dSq < avoidRadius * avoidRadius) {
                        obsSteer.x += dx / dSq;
                        obsSteer.y += dy / dSq;
                        obsCount++;
                    }
                }

                // Calculate Forces (Checking > 0 to prevent NaN propagation on div)
                if (aliCount > 0) ali.div(aliCount).normalize().mult(localMaxSpeed).sub(this.velocity).limit(maxForce);
                if (cohCount > 0) {
                    coh.div(cohCount).sub(this.position).normalize().mult(localMaxSpeed).sub(this.velocity).limit(maxForce);
                }
                if (sepCount > 0) sep.div(sepCount).normalize().mult(localMaxSpeed).sub(this.velocity).limit(maxForce);
                
                if (fleeCount > 0) flee.div(fleeCount).normalize().mult(localMaxSpeed).sub(this.velocity).limit(maxForce * 2.5);
                if (chaseCount > 0) {
                    chase.div(chaseCount).sub(this.position).normalize().mult(localMaxSpeed).sub(this.velocity).limit(maxForce * 1.5);
                }
                if (obsCount > 0) obsSteer.div(obsCount).normalize().mult(localMaxSpeed).sub(this.velocity).limit(maxForce * 3.0);

                // Apply Weights
                sep.mult(params.separationWeight);
                ali.mult(params.alignmentWeight);
                coh.mult(params.cohesionWeight);
                obsSteer.mult(params.obstacleAvoidanceWeight);
                
                let localFleeWeight = this.type === 'prey' ? this.dna.fleeWeight : 0;
                flee.mult(localFleeWeight);
                chase.mult(params.chaseWeight);

                this.acceleration.add(sep).add(ali).add(coh).add(obsSteer).add(flee).add(chase);
            }

            update() {
                if (this.dead) return;

                let localMaxSpeed = this.type === 'predator' ? params.predSpeed : this.dna.maxSpeed;
                
                // Predator Metabolism
                if (this.type === 'predator') {
                    this.energy -= params.predMetabolism; 
                    if (this.energy <= 0) this.dead = true;
                    
                    if (this.satiation > 0) {
                        this.acceleration.x += (Math.random() - 0.5) * 0.2;
                        this.acceleration.y += (Math.random() - 0.5) * 0.2;
                    }
                }

                this.previousPosition.set(this.position.x, this.position.y);
                this.position.add(this.velocity);
                this.velocity.add(this.acceleration);
                this.velocity.limit(localMaxSpeed);
                this.acceleration.mult(0);
            }

            draw(alpha) {
                if (this.dead) return;
                let theta = this.velocity.heading() + Math.PI / 2;
                
                ctx.save();
                ctx.translate(
                    this.previousPosition.x + (this.position.x - this.previousPosition.x) * alpha,
                    this.previousPosition.y + (this.position.y - this.previousPosition.y) * alpha
                );
                ctx.rotate(theta);
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 2);
                ctx.lineTo(-this.size, this.size * 2);
                ctx.lineTo(0, this.size);
                ctx.lineTo(this.size, this.size * 2);
                ctx.closePath();
                
                ctx.fillStyle = this.color;
                
                if(this.type === 'predator') {
                    const digesting = this.satiation > 0;
                    ctx.globalAlpha = digesting ? 1 : Math.max(0, Math.min(1, this.energy / 1000));
                    ctx.drawImage(digesting ? predatorGlows.digesting : predatorGlows.hungry, -40, -40);
                    ctx.globalAlpha = 1;
                }
                
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Core Functions ---
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            addBoids(250, 'prey');
            addBoids(4, 'predator'); 
            requestAnimationFrame(animate);
        }

        function resizeCanvas() {
            // Robust check to ensure canvas is never 0x0
            width = window.innerWidth || document.documentElement.clientWidth || 800;
            height = window.innerHeight || document.documentElement.clientHeight || 600;
            canvas.width = width;
            canvas.height = height;
            boidGrid.resize(width, height);
            obstacleGrid.resize(width, height);
            obstaclesDirty = true;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);
        }

        function updateCountsDisplay(preyCount, predCount) {
            if (preyCount !== lastPreyCount) {
                document.getElementById('preyCount').textContent = preyCount;
                lastPreyCount = preyCount;
            }
            if (predCount !== lastPredCount) {
                document.getElementById('predCount').textContent = predCount;
                lastPredCount = predCount;
            }
        }

        function addBoids(count, type) {
            for (let i = 0; i < count; i++) {
                boids.push(new Boid(Math.random() * width, Math.random() * height, type));
            }
        }

        function handleInteraction(x, y) {
            const panel = document.getElementById('controlPanel');
            const rect = panel.getBoundingClientRect();
            if (!panel.classList.contains('max-md:translate-x-[120%]')) { 
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) return; 
            }

            if (currentMode === 'draw') {
                // Fill gaps between input events so fast drags create a continuous wall.
                const start = lastBrushPoint || {x, y};
                const distance = Math.hypot(x - start.x, y - start.y);
                if (lastBrushPoint && distance < 2) return;
                const steps = Math.max(1, Math.ceil(distance / OBSTACLE_SPACING));
                for (let step = 1; step <= steps; step++) {
                    obstacles.push({
                        x: start.x + (x - start.x) * step / steps,
                        y: start.y + (y - start.y) * step / steps,
                        r: OBSTACLE_RADIUS,
                        stroke: strokeId,
                        sample: strokeSample++
                    });
                }
                lastBrushPoint = isDrawing ? {x, y} : null;
                obstaclesDirty = true;
            } else if (currentMode === 'erase') {
                const eraserRadiusSq = 40 * 40;
                obstacles = obstacles.filter(obs => {
                    const dx = obs.x - x;
                    const dy = obs.y - y;
                    return (dx * dx + dy * dy) > eraserRadiusSq;
                });
                obstaclesDirty = true;
            }
        }

        function startStroke(x, y) {
            isDrawing = true;
            lastBrushPoint = null;
            strokeId++;
            strokeSample = 0;
            mouseX = x;
            mouseY = y;
            handleInteraction(x, y);
        }

        function endStroke() {
            isDrawing = false;
            lastBrushPoint = null;
        }

        function render(alpha, elapsed) {
            // Keep the trail duration consistent on high-refresh displays.
            ctx.fillStyle = `rgba(15, 23, 42, ${1 - Math.pow(0.65, elapsed / STEP_MS)})`;
            ctx.fillRect(0, 0, width, height);

            // Draw a smooth path through the collision samples.
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = OBSTACLE_RADIUS * 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            let previous = null;
            for (let obs of obstacles) {
                // Break at separate strokes and erased gaps, avoiding phantom bridges.
                if (!previous || previous.stroke !== obs.stroke || previous.sample + 1 !== obs.sample) {
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x + 0.001, obs.y); // Rounded dot for a single click/tap.
                } else {
                    ctx.lineTo(obs.x, obs.y);
                }
                previous = obs;
            }
            ctx.stroke();

            // Draw Effects (Death = Red, Birth = Green)
            for (let i = deathEffects.length - 1; i >= 0; i--) {
                let e = deathEffects[i];
                ctx.beginPath();
                ctx.arc(e.x, e.y, 10 * (1 - e.life) + 2, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(239, 68, 68, ${e.life})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            for (let i = birthEffects.length - 1; i >= 0; i--) {
                let e = birthEffects[i];
                ctx.beginPath();
                ctx.arc(e.x, e.y, 15 * (1 - e.life) + 2, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(16, 185, 129, ${e.life})`; 
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            for (const boid of boids) boid.draw(alpha);

            if (isDrawing && currentMode === 'erase') {
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 100, 100, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function ageEffects(effects, decay) {
            let count = 0;
            for (const effect of effects) {
                effect.life -= decay;
                if (effect.life > 0) effects[count++] = effect;
            }
            effects.length = count;
        }

        function simulate() {
            ageEffects(deathEffects, 0.1);
            ageEffects(birthEffects, 0.05);
            newborns.length = 0;
            currentPreyCount = 0;
            currentPredCount = 0;
            
            // Count alive boids
            for (let b of boids) {
                if (!b.dead) {
                    b.type === 'prey' ? currentPreyCount++ : currentPredCount++;
                }
            }

            // Logistic Growth Calculation 
            let growthFactor = Math.max(0, 1 - (currentPreyCount / params.maxPrey));
            let activeBreedSpeed = params.breedSpeed * growthFactor;

            boidGrid.rebuild(boids);
            if (obstaclesDirty) {
                obstacleGrid.rebuild(obstacles);
                obstacleAvoidRadius = 0;
                for (const obs of obstacles) obstacleAvoidRadius = Math.max(obstacleAvoidRadius, obs.r + 40);
                obstaclesDirty = false;
            }

            // Compute every force before moving birds, keeping the spatial index valid.
            for (const boid of boids) boid.flock();
            let newbornPreyCount = 0;
            for (let boid of boids) {
                if (boid.dead) continue;
                
                boid.update();
                boid.edges();
                if (boid.dead) continue;

                // Ecosystem: Guaranteed Reproduction Logic with spatial offset
                if (boid.type === 'prey') {
                    boid.breedTimer += activeBreedSpeed;
                    if (boid.breedTimer >= 1000 && (currentPreyCount + newbornPreyCount) < params.maxPrey) {
                        boid.breedTimer = 0; // Reset maturity
                        // Add an offset so they don't occupy the exact same coordinate
                        let offsetX = (Math.random() - 0.5) * 10;
                        let offsetY = (Math.random() - 0.5) * 10;
                        newborns.push(new Boid(boid.position.x + offsetX, boid.position.y + offsetY, 'prey', boid.dna));
                        newbornPreyCount++;
                        birthEffects.push({x: boid.position.x, y: boid.position.y, life: 1.0}); 
                    }
                } else if (boid.type === 'predator') {
                    if (boid.energy > 3500) { 
                        boid.energy = 1500; 
                        let offsetX = (Math.random() - 0.5) * 10;
                        let offsetY = (Math.random() - 0.5) * 10;
                        newborns.push(new Boid(boid.position.x + offsetX, boid.position.y + offsetY, 'predator'));
                        birthEffects.push({x: boid.position.x, y: boid.position.y, life: 1.0});
                    }
                }
            }

            // Cleanup dead, add newborns
            let aliveCount = 0;
            currentPreyCount = 0;
            currentPredCount = 0;
            for (const boid of boids) {
                if (!boid.dead) boids[aliveCount++] = boid;
            }
            boids.length = aliveCount;
            for (const newborn of newborns) boids.push(newborn);
            for (const boid of boids) {
                if (boid.type === 'prey') currentPreyCount++;
                else currentPredCount++;
            }
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);
            if (document.hidden) return;
            const elapsed = lastFrameTime === null ? STEP_MS : Math.max(0, timestamp - lastFrameTime);
            lastFrameTime = timestamp;
            // Bound catch-up work after a stall so it cannot cause another long frame.
            accumulator += Math.min(elapsed, STEP_MS * MAX_STEPS);
            let steps = 0;
            while (accumulator + 0.000001 >= STEP_MS && steps < MAX_STEPS) {
                simulate();
                accumulator = Math.max(0, accumulator - STEP_MS);
                steps++;
            }
            render(accumulator / STEP_MS, Math.min(elapsed, STEP_MS * MAX_STEPS));
            if (timestamp - lastCountTime >= 100) {
                updateCountsDisplay(currentPreyCount, currentPredCount);
                lastCountTime = timestamp;
            }
        }

        document.addEventListener('visibilitychange', () => {
            lastFrameTime = null;
            accumulator = 0;
            endStroke();
        });

        // --- Event Listeners ---

        let mouseX = 0;
        let mouseY = 0;

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) startStroke(e.clientX, e.clientY);
        });
        canvas.addEventListener('mousemove', (e) => { 
            mouseX = e.clientX; mouseY = e.clientY;
            if(isDrawing) handleInteraction(e.clientX, e.clientY); 
        });
        canvas.addEventListener('mouseup', endStroke);
        canvas.addEventListener('mouseleave', endStroke);
        window.addEventListener('blur', endStroke);

        canvas.addEventListener('touchstart', (e) => { 
            e.preventDefault();
            startStroke(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { 
            e.preventDefault(); 
            mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
            if(isDrawing) handleInteraction(mouseX, mouseY); 
        }, {passive: false});
        canvas.addEventListener('touchend', endStroke);
        canvas.addEventListener('touchcancel', endStroke);

        // UI Binding
        const bindSlider = (id, paramKey, displayId, suffix = '') => {
            const el = document.getElementById(id);
            const disp = document.getElementById(displayId);
            el.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                params[paramKey] = val;
                if(displayId) {
                    disp.innerText = (val % 1 === 0 && val > 20) ? val : val.toFixed(1) + suffix;
                }
            });
        };

        // Eco sliders
        bindSlider('breedSpeed', 'breedSpeed', 'reproVal');
        bindSlider('maxPop', 'maxPrey', 'maxPopVal');
        bindSlider('metabolism', 'predMetabolism', 'metabolismVal');
        
        // Physics Sliders
        bindSlider('separation', 'separationWeight', 'sepVal');
        bindSlider('maxSpeed', 'baseMaxSpeed', 'speedVal');
        bindSlider('fleeWeight', 'baseFleeWeight', 'fleeVal');
        bindSlider('chaseWeight', 'chaseWeight', 'chaseVal');
        bindSlider('predSpeed', 'predSpeed', 'predSpeedVal');

        document.getElementById('addPreyBtn').addEventListener('click', () => addBoids(50, 'prey'));
        document.getElementById('addPredBtn').addEventListener('click', () => addBoids(1, 'predator'));
        document.getElementById('clearObsBtn').addEventListener('click', () => {
            endStroke();
            obstacles.length = 0;
            obstaclesDirty = true;
        });

        const toggleModeBtn = document.getElementById('toggleModeBtn');
        toggleModeBtn.addEventListener('click', () => {
            endStroke();
            if (currentMode === 'draw') {
                currentMode = 'erase';
                toggleModeBtn.innerText = 'Brush: Erase Obstacles';
                toggleModeBtn.classList.replace('bg-slate-600', 'bg-slate-800');
                toggleModeBtn.classList.add('border', 'border-red-500');
            } else {
                currentMode = 'draw';
                toggleModeBtn.innerText = 'Brush: Draw Obstacle';
                toggleModeBtn.classList.replace('bg-slate-800', 'bg-slate-600');
                toggleModeBtn.classList.remove('border', 'border-red-500');
            }
        });

        const toggleBtn = document.getElementById('toggleBtn');
        const controlPanel = document.getElementById('controlPanel');
        
        toggleBtn.addEventListener('click', () => {
            controlPanel.classList.toggle('max-md:translate-x-[120%]');
            toggleBtn.style.transform = controlPanel.classList.contains('max-md:translate-x-[120%]') ? 'rotate(0deg)' : 'rotate(90deg)';
            toggleBtn.style.transition = 'transform 0.3s';
        });

        window.onload = init;

    </script>
</body>
</html>
